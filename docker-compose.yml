services:
  cdp:
    build: .
    image: the-pour-over-cdp:local
    ports:
      - "${CDP_PORT:-8080}:8080"
    environment:
      CDP_USERNAME: ${CDP_USERNAME:-growth}
      CDP_PASSWORD: ${CDP_PASSWORD:-pour-over}
      RECRUITER_USERNAME: ${RECRUITER_USERNAME:-recruiter}
      RECRUITER_PASSWORD: ${RECRUITER_PASSWORD:-demo}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?Set WEBHOOK_SECRET in .env}
      PII_HASH_SALT: ${PII_HASH_SALT:?Set PII_HASH_SALT in .env}
      DB_USERNAME: ${DB_USERNAME:-sa}
      DB_PASSWORD: ${DB_PASSWORD:-}
      CDP_H2_CONSOLE: ${CDP_H2_CONSOLE:-false}
      SPRING_AI_OPENAI_API_KEY: ${SPRING_AI_OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      SPRING_DATASOURCE_URL: jdbc:h2:file:./data/cdp;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=TRUE
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_ALLOWED_LOGINS: ${GITHUB_ALLOWED_LOGINS:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    volumes:
      - cdp-data:/app/data
    restart: unless-stopped

volumes:
  cdp-data:
