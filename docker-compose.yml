services:
  cdp:
    build: .
    image: the-pour-over-cdp:local
    ports:
      - "${CDP_PORT:-8080}:8080"
    # Values come from a root `.env` (see .env.example) via Compose substitution.
    environment:
      UI_PASSWORD: ${UI_PASSWORD:-pour-over}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-webhook-secret}
      PII_HASH_SALT: ${PII_HASH_SALT:-dev-pii-salt}
      DB_USERNAME: ${DB_USERNAME:-sa}
      DB_PASSWORD: ${DB_PASSWORD:-}
      SPRING_AI_OPENAI_API_KEY: ${SPRING_AI_OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      SPRING_DATASOURCE_URL: jdbc:h2:file:./data/cdp;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=TRUE
    volumes:
      - cdp-data:/app/data
    restart: unless-stopped

volumes:
  cdp-data:
